<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
<!-- ======================================================================
  NORTHEASTERN GUEST SPEAKER SERIES — 16:9 1920x1080
  LOCKED: Northeastern colors, series branding, SEIS/Teams labels, red frame.
  EDITABLE: items marked EDIT — photo, title, description, date/time,
  speaker, QR code, course/host line.
====================================================================== -->
<rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
<rect x="15.0" y="15.0" width="1890" height="1050" fill="none" stroke="#C12925" stroke-width="30"/>
<g id="editable-photo">
<!-- EDIT: speaker/event photo — replace doug-menuez.png -->
<clipPath id="editable-photo-clip"><rect x="30" y="30" width="800" height="1020"/></clipPath>
<rect x="30" y="30" width="800" height="1020" fill="#dddddd"/>
<g clip-path="url(#editable-photo-clip)">
<image xlink:href="doug-menuez.png" href="doug-menuez.png" x="30" y="30" width="800" height="1020" preserveAspectRatio="xMidYMid slice"/>
</g>
</g>
<g id="fixed-nu-lockup">
<!-- FIXED: Northeastern lockup -->
<text x="900" y="150" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="68" font-weight="900" fill="#C12925">N</text>
<text x="978.2" y="107.84" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#111111">Northeastern University</text>
<text x="978.2" y="133.84" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#111111">Software Engineering</text>
<text x="978.2" y="159.84" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#111111">and Information Systems</text>
</g>
<g id="editable-qr">
<!-- EDIT: replace with the event's QR code (link to Teams/registration) -->
<rect x="1720" y="70" width="130" height="130" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="10,7"/>
<text x="1785.0" y="141.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">QR CODE</text>
</g>
<g id="fixed-series-title">
<!-- FIXED: series branding -->
<text x="900" y="300" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="92" font-weight="900" fill="#111111" text-anchor="start" letter-spacing="-2">Guest Speaker Series</text>
</g>
<text x="900" y="340" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#C12925" text-anchor="start" letter-spacing="4">LIVE ON MICROSOFT TEAMS</text>
<!-- FIXED: Teams label -->
<g id="editable-event-title">
<!-- EDIT: event title -->
<text x="900" y="470" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="104" font-weight="900" fill="#111111" text-anchor="start" letter-spacing="-2">Fearless Genius</text>
</g>
<g id="editable-event-desc">
<!-- EDIT: one-line description -->
<text x="900" y="530" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0">A conversation on Silicon Valley, creativity, and technological change.</text></g>
<g id="editable-datetime">
<!-- EDIT: date and time -->
<rect x="900" y="570" width="301" height="52" fill="#111111"/>
<text x="918" y="604" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="1">SATURDAY, OCT. 10, 2026</text>
</g>
<g id="editable-datetime-time">
<rect x="900" y="634" width="301" height="48" fill="none" stroke="#111111" stroke-width="3"/>
<text x="918" y="666" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#111111">12:00–1:30 PM ET</text>
</g>
<g id="editable-speaker">
<!-- EDIT: speaker name -->
<text x="900" y="716" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="44" font-weight="900" fill="#111111" text-anchor="start" letter-spacing="0">Doug Menuez</text>
<text x="900" y="756" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0">Documentary Photographer · Author of Fearless Genius</text>
</g>
<line x1="900" y1="980" x2="1850" y2="980" stroke="#111111" stroke-width="3"/>
<g id="editable-course">
<!-- EDIT: course / host line -->
<text x="900" y="1010" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#111111" text-anchor="start" letter-spacing="0">INFO 7375: Branding &amp; AI</text></g>
</svg>
